name: Compile GDExtension and Package Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            target: template_debug
            variant: arm64
            scons_flags: ""
          - platform: macos
            os: macos-latest
            target: template_release
            variant: arm64
            scons_flags: ""
          - platform: macos
            os: macos-latest
            target: editor
            variant: arm64
            scons_flags: ""

          - platform: windows
            os: windows-latest
            target: template_debug
            variant: x86_64
            scons_flags: ""
          - platform: windows
            os: windows-latest
            target: template_release
            variant: x86_64
            scons_flags: ""
          - platform: windows
            os: windows-latest
            target: editor
            variant: x86_64
            scons_flags: ""

          - platform: linux
            os: ubuntu-latest
            target: template_debug
            variant: x86_64
            scons_flags: ""
          - platform: linux
            os: ubuntu-latest
            target: template_release
            variant: x86_64
            scons_flags: ""
          - platform: linux
            os: ubuntu-latest
            target: editor
            variant: x86_64
            scons_flags: ""

          - platform: android
            os: ubuntu-latest
            target: template_debug
            variant: arm64
            scons_flags: "arch=arm64"
          - platform: android
            os: ubuntu-latest
            target: template_release
            variant: arm64
            scons_flags: "arch=arm64"
          - platform: android
            os: ubuntu-latest
            target: template_debug
            variant: x86_64
            scons_flags: "arch=x86_64"
          - platform: android
            os: ubuntu-latest
            target: template_release
            variant: x86_64
            scons_flags: "arch=x86_64"
          - platform: android
            os: ubuntu-latest
            target: editor
            variant: arm64
            scons_flags: "arch=arm64"
          - platform: android
            os: ubuntu-latest
            target: editor
            variant: x86_64
            scons_flags: "arch=x86_64"

          # Note: Godot does not support running the Godot Editor on iOS, so no iOS editor target is compiled.
          - platform: ios
            os: macos-latest
            target: template_debug
            variant: device-arm64
            scons_flags: "ios_simulator=no arch=arm64"
          - platform: ios
            os: macos-latest
            target: template_release
            variant: device-arm64
            scons_flags: "ios_simulator=no arch=arm64"
          - platform: ios
            os: macos-latest
            target: template_debug
            variant: sim-arm64
            scons_flags: "ios_simulator=yes arch=arm64"
          - platform: ios
            os: macos-latest
            target: template_release
            variant: sim-arm64
            scons_flags: "ios_simulator=yes arch=arm64"

          - platform: web
            os: ubuntu-latest
            target: template_debug
            variant: nothreads
            scons_flags: "threads=no"
          - platform: web
            os: ubuntu-latest
            target: template_release
            variant: nothreads
            scons_flags: "threads=no"
          - platform: web
            os: ubuntu-latest
            target: template_debug
            variant: threads
            scons_flags: "threads=yes"
          - platform: web
            os: ubuntu-latest
            target: template_release
            variant: threads
            scons_flags: "threads=yes"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons and dependencies
        shell: bash
        run: |
          pip install scons flatbuffers
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install patchelf
          fi

      - name: Checkout godot-cpp submodule
        run: git submodule update --init --recursive --depth 1 thirdparty/godot-cpp

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: build/godot-cpp
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.variant }}-${{ hashFiles('.gitmodules', 'SConstruct') }}
          restore-keys: |
            godot-cpp-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.variant }}-

      - name: Clean pre-existing binaries
        shell: bash
        run: |
          rm -f project/addons/godot-gaze/bin/*.dylib
          rm -f project/addons/godot-gaze/bin/*.dll
          rm -f project/addons/godot-gaze/bin/*.so
          rm -f project/addons/godot-gaze/bin/*.a
          rm -f project/addons/godot-gaze/bin/*.wasm

      - name: Cache Android NDK
        if: matrix.platform == 'android'
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.1.13356709
          key: ndk-28.1.13356709
          restore-keys: |
            ndk-

      - name: Setup dependencies (Android NDK)
        if: matrix.platform == 'android' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Setup dependencies (Web Emscripten)
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.20'

      # Compilation step
      - name: Build GDExtension
        shell: bash
        run: |
          scons platform=${{ matrix.platform }} target=${{ matrix.target }} ${{ matrix.scons_flags }}
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.1.13356709

      - name: Clean intermediate symlinks and import libs before upload
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: |
          rm -f project/addons/godot-gaze/bin/libonnxruntime.1.dylib
          rm -f project/addons/godot-gaze/bin/*.lib

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.variant }}
          path: project/addons/godot-gaze/bin/
          if-no-files-found: warn

  package:
    name: Package Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean pre-existing binaries from repo
        run: |
          rm -rf project/addons/godot-gaze/bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for model conversion
        run: |
          pip install numpy openvino2onnx onnx "onnxruntime==1.28.0"

      - name: Download and Convert Models
        shell: bash
        run: |
          bash scripts/download_models.sh
          cp -f scripts/required_operators.config project/addons/godot-gaze/models/required_operators.config
          rm -f project/addons/godot-gaze/models/*.onnx
          rm -f project/addons/godot-gaze/models/*.tflite
          rm -f project/addons/godot-gaze/models/*.task
          rm -f project/addons/godot-gaze/models/*.xml
          rm -f project/addons/godot-gaze/models/*.bin
          rm -f project/addons/godot-gaze/models/*.with_runtime_opt.ort
          rm -f project/addons/godot-gaze/models/*.required_operators*.config

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp-binaries

      - name: Copy binaries to addon folder
        run: |
          mkdir -p project/addons/godot-gaze/bin
          for d in temp-binaries/bin-*; do
            if [ -d "$d" ]; then
              cp -rp "$d"/* project/addons/godot-gaze/bin/
            fi
          done

      - name: Display package structure
        run: |
          ls -la project/addons/godot-gaze/bin/
          ls -la project/addons/godot-gaze/models/

      - name: Verify Release Package Contents
        shell: bash
        run: |
          required_models=(
            "project/addons/godot-gaze/models/face_detection_yunet_2023mar.ort"
            "project/addons/godot-gaze/models/facial-landmarks-35-adas-0002.ort"
            "project/addons/godot-gaze/models/gaze-estimation-adas-0002.ort"
            "project/addons/godot-gaze/models/open_closed_eye.ort"
            "project/addons/godot-gaze/models/required_operators.config"
          )
          for f in "${required_models[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Missing or empty required model file: $f" >&2
              exit 1
            fi
          done

          required_bins=(
            "project/addons/godot-gaze/bin/libgaze.macos.editor.dylib"
            "project/addons/godot-gaze/bin/libgaze.macos.template_debug.dylib"
            "project/addons/godot-gaze/bin/libgaze.macos.template_release.dylib"
            "project/addons/godot-gaze/bin/libonnxruntime.dylib"
            "project/addons/godot-gaze/bin/gaze.windows.editor.x86_64.dll"
            "project/addons/godot-gaze/bin/gaze.windows.template_debug.x86_64.dll"
            "project/addons/godot-gaze/bin/gaze.windows.template_release.x86_64.dll"
            "project/addons/godot-gaze/bin/onnxruntime.dll"
            "project/addons/godot-gaze/bin/libgaze.linux.editor.x86_64.so"
            "project/addons/godot-gaze/bin/libgaze.linux.template_debug.x86_64.so"
            "project/addons/godot-gaze/bin/libgaze.linux.template_release.x86_64.so"
            "project/addons/godot-gaze/bin/libonnxruntime.so"
            "project/addons/godot-gaze/bin/libgaze.android.editor.arm64.so"
            "project/addons/godot-gaze/bin/libgaze.android.template_debug.arm64.so"
            "project/addons/godot-gaze/bin/libgaze.android.template_release.arm64.so"
            "project/addons/godot-gaze/bin/libgaze.android.editor.x86_64.so"
            "project/addons/godot-gaze/bin/libgaze.android.template_debug.x86_64.so"
            "project/addons/godot-gaze/bin/libgaze.android.template_release.x86_64.so"
            "project/addons/godot-gaze/bin/android/arm64/libonnxruntime.so"
            "project/addons/godot-gaze/bin/android/x86_64/libonnxruntime.so"
            "project/addons/godot-gaze/bin/libgaze.ios.template_debug.arm64.a"
            "project/addons/godot-gaze/bin/libgaze.ios.template_release.arm64.a"
            "project/addons/godot-gaze/bin/libgaze.ios.template_debug.simulator.arm64.a"
            "project/addons/godot-gaze/bin/libgaze.ios.template_release.simulator.arm64.a"
            "project/addons/godot-gaze/bin/gaze.javascript.template_debug.wasm"
            "project/addons/godot-gaze/bin/gaze.javascript.template_release.wasm"
            "project/addons/godot-gaze/bin/gaze.javascript.template_debug.threads.wasm"
            "project/addons/godot-gaze/bin/gaze.javascript.template_release.threads.wasm"
            "project/addons/godot-gaze/bin/gaze_sidecar.js"
          )
          for f in "${required_bins[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Missing or empty required binary file: $f" >&2
              exit 1
            fi
          done
          echo "All release package files verified!"

      - name: Zip Release Artifact
        run: |
          cd project
          zip -r ../godot-gaze.zip addons/godot-gaze/ -x "addons/godot-gaze/tests/*" "addons/godot-gaze/tools/*"

      - name: Upload Final Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: godot-gaze-release
          path: godot-gaze.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: godot-gaze.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
