<!DOCTYPE html>
<html>
<head>
    <title>Gaze Sidecar Coordinate Parity Test</title>
    <!-- Include Gaze Sidecar -->
    <script src="/src/web/gaze_sidecar.js"></script>
</head>
<body>
    <h1>Gaze Sidecar Coordinate Parity Test</h1>
    <canvas id="testCanvas" width="640" height="480" style="display:none;"></canvas>
    <div id="status">Waiting for OpenCV...</div>

    <script>
        var useMock = new URLSearchParams(window.location.search).get('mock') !== 'false';
        window.useMock = useMock;

        // Mock document.createElement to handle video metadata read-only properties
        var originalCreateElement = document.createElement;
        document.createElement = function(tagName) {
            var el = originalCreateElement.call(document, tagName);
            if (tagName.toLowerCase() === 'video') {
                Object.defineProperty(el, 'videoWidth', { get: function() { return 640; } });
                Object.defineProperty(el, 'videoHeight', { get: function() { return 480; } });
                Object.defineProperty(el, 'paused', { get: function() { return false; } });
            }
            return el;
        };

        window.lastGazeFeed = null;

        // Mock godotGaze to capture feed_gaze calls
        window.godotGaze = {
            feed_gaze: function(face_detected, lex, ley, lez, rex, rey, rez, dx, dy, dz, tx, ty, tz, rx, ry, rz, canvasX, canvasY) {
                window.lastGazeFeed = {
                    face_detected, lex, ley, lez, rex, rey, rez, dx, dy, dz, tx, ty, tz, rx, ry, rz, canvasX, canvasY
                };
            }
        };

        // Mock devicePixelRatio to 2.0 to simulate Retina/High-DPI screens and verify coordinate logical scaling stability
        Object.defineProperty(window, 'devicePixelRatio', {
            get: function() { return 2.0; },
            configurable: true
        });

        // Mock getUserMedia
        navigator.mediaDevices.getUserMedia = function() {
            var stream = (typeof MediaStream !== 'undefined') ? new MediaStream() : {};
            stream.getTracks = function() { return [{ stop: function() {} }]; };
            return Promise.resolve(stream);
        };

        // Helper to convert array buffer to hex
        function arrayBufferToHex(buffer) {
            var bytes = new Uint8Array(buffer);
            var hex = '';
            for (var i = 0; i < bytes.length; i++) {
                var val = bytes[i].toString(16);
                if (val.length < 2) val = '0' + val;
                hex += val;
            }
            return hex;
        }

        var rawCppTestData = {
            'self_center.jpg': {
                tx: 12.3642, ty: -0.169909, tz: 748.723,
                rx: 0.103826, ry: 0.0288909, rz: -0.00134379,
                gx: 0.243377, gy: -0.150474, gz: -0.958189
            },
            'self_left_left.jpg': {
                tx: 48.0196, ty: -4.66556, tz: 791.324,
                rx: 0.105083, ry: -0.248268, rz: 0.0172542,
                gx: 0.467116, gy: -0.268395, gz: -0.842477
            },
            'self_right_right.jpg': {
                tx: -14.8077, ty: 1.08338, tz: 744.449,
                rx: 0.143002, ry: 0.18954, rz: -0.02105,
                gx: -0.369936, gy: -0.0611251, gz: -0.927044
            },
            'self_top_top.jpg': {
                tx: 16.634, ty: -14.0802, tz: 775.692,
                rx: 0.13979, ry: 0.0264727, rz: -0.0397824,
                gx: 0.103826, gy: 0.0701991, gz: -0.992115
            },
            'self_down_down.jpg': {
                tx: 20.009, ty: 8.6887, tz: 757.977,
                rx: 0.125737, ry: 0.00394679, rz: 0.0468254,
                gx: 0.228168, gy: -0.200452, gz: -0.952764
            }
        };

        function rodriguesToRotationMatrix(rvec) {
            var theta = Math.sqrt(rvec[0] * rvec[0] + rvec[1] * rvec[1] + rvec[2] * rvec[2]);
            if (theta < 1e-6) {
                return [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
            }
            var kx = rvec[0] / theta;
            var ky = rvec[1] / theta;
            var kz = rvec[2] / theta;
            var cosT = Math.cos(theta);
            var sinT = Math.sin(theta);
            var oneMinusCosT = 1.0 - cosT;

            return [
                [
                    cosT + kx * kx * oneMinusCosT,
                    kx * ky * oneMinusCosT - kz * sinT,
                    kx * kz * oneMinusCosT + ky * sinT
                ],
                [
                    ky * kx * oneMinusCosT + kz * sinT,
                    cosT + ky * ky * oneMinusCosT,
                    ky * kz * oneMinusCosT - kx * sinT
                ],
                [
                    kz * kx * oneMinusCosT - ky * sinT,
                    kz * ky * oneMinusCosT + kx * sinT,
                    cosT + kz * kz * oneMinusCosT
                ]
            ];
        }

        var cppTestData = {};
        for (var k in rawCppTestData) {
            var d = rawCppTestData[k];
            var R = rodriguesToRotationMatrix([d.rx, d.ry, d.rz]);
            var eyeX = (typeof FaceModelGeometry !== 'undefined' && FaceModelGeometry.EYE_X) ? FaceModelGeometry.EYE_X : 30.5;
            var eyeY = (typeof FaceModelGeometry !== 'undefined' && FaceModelGeometry.EYE_Y) ? FaceModelGeometry.EYE_Y : -32.0;
            var eyeZ = (typeof FaceModelGeometry !== 'undefined' && FaceModelGeometry.EYE_Z) ? FaceModelGeometry.EYE_Z : 39.0;

            cppTestData[k] = {
                tx: d.tx, ty: d.ty, tz: d.tz,
                rx: d.rx, ry: d.ry, rz: d.rz,
                gx: d.gx, gy: d.gy, gz: d.gz,
                lex: R[0][0] * eyeX + R[0][1] * eyeY + R[0][2] * eyeZ + d.tx,
                ley: R[1][0] * eyeX + R[1][1] * eyeY + R[1][2] * eyeZ + d.ty,
                lez: R[2][0] * eyeX + R[2][1] * eyeY + R[2][2] * eyeZ + d.tz,
                rex: R[0][0] * -eyeX + R[0][1] * eyeY + R[0][2] * eyeZ + d.tx,
                rey: R[1][0] * -eyeX + R[1][1] * eyeY + R[1][2] * eyeZ + d.ty,
                rez: R[2][0] * -eyeX + R[2][1] * eyeY + R[2][2] * eyeZ + d.tz
            };
        }

        window.cppTestData = cppTestData;

        function initMock() {
            if (window.ort) return;
            console.log('[TestRunner] Initializing ONNX Runtime Mock...');
            window.ort = {
                Tensor: function(type, data, shape) {
                    this.data = data;
                    this.shape = shape;
                },
                InferenceSession: {
                    create: function(modelBytes) {
                        return Promise.resolve({
                            inputNames: ['input'],
                            outputNames: ['output'],
                            run: function(feeds) {
                                return Promise.resolve({
                                    output: {
                                        data: new Float32Array([0, 0, -1])
                                    }
                                });
                            }
                        });
                    }
                }
            };
            if (window.gazeTracker) {
                window.gazeTracker.injectScript = function(localUrl, onload, onerror) {
                    console.log('[TestRunner] Mock injectScript intercepting load of: ' + localUrl);
                    setTimeout(onload, 10);
                };
                window.gazeTracker.setModels('', '');
                document.getElementById('status').innerText = 'ONNX Runtime mock initialized. Ready for test.';
            }
        }

        // Initialize and load models
        function initTest() {
            return new Promise((resolve, reject) => {
                if (useMock) {
                    initMock();
                    resolve();
                } else {
                    document.getElementById('status').innerText = 'Loading models...';
                    Promise.all([
                        fetch('/project/addons/godot-gaze/models/face_detection_yunet_2023mar.ort').then(r => r.arrayBuffer()),
                        fetch('/project/addons/godot-gaze/models/gaze-estimation-adas-0002.ort').then(r => r.arrayBuffer())
                    ]).then(([bufYunet, bufGaze]) => {
                        var hexYunet = arrayBufferToHex(bufYunet);
                        var hexGaze = arrayBufferToHex(bufGaze);
                        window.gazeTracker.setModels(hexYunet, hexGaze);
                        document.getElementById('status').innerText = 'Models loaded. Ready for test.';
                        resolve();
                    }).catch(err => reject(err));
                }
            });
        }

        window.runGazeTest = function(imageName) {
            window.currentTestImage = imageName;
            window.lastGazeFeed = null;
            return new Promise((resolve, reject) => {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById('testCanvas');
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 640, 480);

                    // Start tracking if not active
                    if (!window.gazeTracker.active) {
                        window.gazeTracker.startTracking('', '', false);
                    }

                    // Poll for feed_gaze to be called
                    var checkFeed = setInterval(function() {
                        if (window.lastGazeFeed) {
                            clearInterval(checkFeed);
                            resolve(window.lastGazeFeed);
                        }
                    }, 50);
                };
                img.onerror = function() {
                    reject(new Error('Failed to load image: ' + imageName));
                };
                img.src = '/tests/resources/' + imageName;
            });
        };

        // Start initialization
        window.initPromise = initTest();
    </script>
</body>
</html>
